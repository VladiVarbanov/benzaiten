version: v0

execution_status:
  - pending
  - active
  - completed
  - failed
  - cancelled

priority:
  - low
  - medium
  - high
  - critical

result_status:
  - complete
  - partial

error_category:
  - rejection
  - validation
  - execution
  - timeout
  - cancelled

error_source:
  - task_executive
  - agent
  - model
  - tool

requirement_resolution_status:
  - available
  - unavailable
  - deferred

worker_kind:
  - model
  - agent
  - tool

plan_step_execution_status:
  - authorized
  - ready
  - running
  - completed
  - failed
  - skipped
  - blocked

failure_policy:
  - stop
  - retry
  - skip
  - request_replan
  - escalate

validation_outcome:
  - not_started
  - passed
  - failed
  - partial
  - inconclusive

director_outcome:
  - ACCEPT
  - REVISE
  - ASK_GUIDANCE

guidance_target:
  - user
  - frontier

guidance_policy:
  - USER_ONLY
  - ASK_BEFORE_FRONTIER
  - FRONTIER_ALLOWED

artifact_validation_status:
  - pending
  - valid
  - invalid

semantics:
  attempt:
    description: Transport or execution attempt; never a semantic iteration.
  semantic_iteration:
    description: Director-recognized meaningful advancement authoritatively stored in job or Vault state and bounded by Task Executive policy.
  okf_iteration_snapshot:
    description: Recorded semantic iteration when an OKF draft was accepted; never an authoritative counter.
  resolved:
    description: Logical worker identity selected from configured participant-role mappings; not concrete deployment details.
  trace_deployment:
    description: Concrete agent, session, model, compute node, and host that performed execution.
  terminal_profiles:
    description: Successful terminal executions use status completed, populate result, and clear error; failed terminal executions use status failed, populate error, and clear result.
  artifact_record:
    description: Optional and conditional; present only when execution creates or updates a persistable knowledge artifact or draft, otherwise absent or null.
  task_persistence:
    description: Persistence mechanics for one task execution record.
  plan_execution_persistence:
    description: Persistence mechanics for associated plan-execution state.
  director_outcome:
    description: Director-authored ACCEPT, REVISE, or ASK_GUIDANCE judgment over one TaskExecution; Task Executive only validates and records it.
  root_checkpoint:
    description: The distinguished planning-certified Plan @r1 plus trusted planning finalization and deterministic certification evidence; it has no TaskExecution ACCEPT outcome.
  execution_checkpoint:
    description: A Plan revision plus a real Director ACCEPT TaskExecution outcome.
  execution_transition:
    description: One chronological successor Plan revision after @r1; consumed transitions equal highest revision minus one.
